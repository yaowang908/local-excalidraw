[package]
name = "local-excalidraw"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[lib]
name = "local_excalidraw"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
local-excalidraw-filesystem = { path = "../../../packages/filesystem" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
tempfile = "3"

[dev-dependencies]

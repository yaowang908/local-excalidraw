[package]
name = "local-excalidraw-filesystem"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "excalidraw-fs"
path = "src/bin/excalidraw-fs.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
trash = "5"
notify = "8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSFileCoordinator", "NSFilePresenter", "NSURL", "NSString", "NSError", "block2"] }
block2 = "0.6.2"
